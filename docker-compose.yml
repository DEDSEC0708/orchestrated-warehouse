# =============================================================================
# ORCHESTRATED WAREHOUSE - local infrastructure
#
# Four services: one PostgreSQL, one one-shot Airflow bootstrap, one Airflow
# scheduler, one Airflow webserver. Nothing else.
#
# There is no Redis and no Celery worker because the executor is LocalExecutor,
# and there is no triggerer because no deferrable operator is used. Both are
# decisions with reasons, recorded in docs/adr/006-executor-and-topology.md,
# not omissions.
#
# Every value comes from .env (see .env.example). No credential appears here.
#
#   make up      build, start, wait for health
#   make ps      show status and health of every service
#   make down    stop, keeping the data volume
#   make clean   stop and DELETE the data volume
# =============================================================================
name: volthive

# --- shared Airflow configuration -------------------------------------------
# All three Airflow services run the same image with the same environment and
# differ only in their command. The anchor keeps them from drifting apart.
#
# THE ANCHOR CARRIES THE IMAGE NAME BUT NOT THE BUILD.
#
# Putting `build:` here too is the obvious thing to do, and it is what the
# upstream Airflow compose file does. It is also a race. Compose delegates
# builds to buildx bake, which turns every service with a `build:` section
# into its own target and runs them CONCURRENTLY. Three targets then export
# the same image name at the same time, and the image store rejects the
# losers:
#
#   target airflow-init: failed to solve:
#   image "docker.io/volthive/airflow:2.10.5-local": already exists
#
# One service shows CANCELED, the others ERROR, and which one wins varies
# between runs. The classic (pre-bake) builder deduplicated identical build
# definitions, which is why this shape survived for years before surfacing.
#
# So exactly ONE service owns the build - airflow-init, below - and the other
# two consume the image it produces. That is not a workaround: the dependency
# graph already requires airflow-init to finish before either long-running
# service starts (`service_completed_successfully`), so the image is
# guaranteed to exist by the time they are created. The build order is now
# stated once, in the place that already enforced it.
x-airflow-common: &airflow-common
  image: volthive/airflow:2.10.5-local
  # Never reach a registry for this tag. It is built locally and only locally;
  # `volthive/airflow` is not a repository this project publishes. Without
  # this, a missing image sends Docker to Docker Hub, where it would either
  # fail confusingly or - worse - succeed against a stranger's image that
  # happens to occupy that name.
  pull_policy: never
  # UID must match the host user on Linux, or bind-mounted files become
  # root-owned and undeletable. Group 0 is what the base image expects.
  # Docker Desktop on Windows and macOS handles ownership itself.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    # --- core ---------------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW__CORE__PARALLELISM:-8}
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG:-6}
    # Airflow runs in UTC. Business dates are derived in Asia/Kolkata inside the
    # warehouse, never by shifting the scheduler's clock.
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW__CORE__DEFAULT_TIMEZONE:-utc}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?run scripts/generate_env.sh to generate a Fernet key}

    # --- metadata database ---------------------------------------------------
    # Composed from the individual role variables so the password exists in
    # exactly one place in .env. Dev passwords must be URL-safe; the template in
    # .env.example is.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/${AIRFLOW_DB:-airflow}

    # --- webserver -----------------------------------------------------------
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?run scripts/generate_env.sh to generate a secret key}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: ${AIRFLOW__WEBSERVER__EXPOSE_CONFIG:-False}

    # --- UI identity ---------------------------------------------------------
    # Cosmetic, and deliberately the whole of the customisation. Every one of
    # these is a documented Airflow setting (instance_name since 2.1, the
    # navbar colours since 2.8/2.9), so the UI stays stock Airflow with a
    # different name and palette - no overridden templates, no patched
    # package, nothing to re-do on the next upgrade.
    #
    # instance_name replaces the word "Airflow" in the navbar AND in the
    # browser tab title on every page. The login screen renders the same
    # navbar, so it picks up the project identity for free - which is why
    # there is no login-page template override here. Airflow 2.10 has no
    # supported hook for that, and an unsupported one would be a fragile fork
    # of FAB's login_db.html for the sake of a logo.
    AIRFLOW__WEBSERVER__INSTANCE_NAME: ${AIRFLOW__WEBSERVER__INSTANCE_NAME:-VoltHive - Orchestrated Warehouse}
    AIRFLOW__WEBSERVER__NAVBAR_COLOR: ${AIRFLOW__WEBSERVER__NAVBAR_COLOR:-#0E3B34}
    AIRFLOW__WEBSERVER__NAVBAR_TEXT_COLOR: ${AIRFLOW__WEBSERVER__NAVBAR_TEXT_COLOR:-#E8F1EE}
    AIRFLOW__WEBSERVER__NAVBAR_HOVER_COLOR: ${AIRFLOW__WEBSERVER__NAVBAR_HOVER_COLOR:-#155047}
    AIRFLOW__WEBSERVER__NAVBAR_TEXT_HOVER_COLOR: ${AIRFLOW__WEBSERVER__NAVBAR_TEXT_HOVER_COLOR:-#FFFFFF}
    AIRFLOW__WEBSERVER__NAVBAR_LOGO_TEXT_COLOR: ${AIRFLOW__WEBSERVER__NAVBAR_LOGO_TEXT_COLOR:-#E8F1EE}

    # --- connections, injected as environment URIs ---------------------------
    # Never added to the metadata database with `airflow connections add`: that
    # would store a second, Fernet-encrypted copy of each password whose key
    # also lives in .env. One copy is easier to rotate and easier to reason
    # about. Airflow reads any AIRFLOW_CONN_<ID> variable as a connection.
    AIRFLOW_CONN_WAREHOUSE_DB: >-
      postgresql://${WH_ETL_USER:-wh_etl}:${WH_ETL_PASSWORD:?set WH_ETL_PASSWORD in .env}@postgres:5432/${WH_DB:-warehouse}
    AIRFLOW_CONN_CMS_DB: >-
      postgresql://${CMS_READER_USER:-cms_reader}:${CMS_READER_PASSWORD:?set CMS_READER_PASSWORD in .env}@postgres:5432/${CMS_DB:-cms}

    # --- application ---------------------------------------------------------
    # Read by src/volthive/config/settings.py.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    WH_DB: ${WH_DB:-warehouse}
    CMS_DB: ${CMS_DB:-cms}
    WH_ETL_USER: ${WH_ETL_USER:-wh_etl}
    WH_ETL_PASSWORD: ${WH_ETL_PASSWORD}
    CMS_READER_USER: ${CMS_READER_USER:-cms_reader}
    CMS_READER_PASSWORD: ${CMS_READER_PASSWORD}
    VOLTHIVE_ENV: ${VOLTHIVE_ENV:-local}
    VOLTHIVE_LOG_LEVEL: ${VOLTHIVE_LOG_LEVEL:-INFO}
    VOLTHIVE_LOG_JSON: ${VOLTHIVE_LOG_JSON:-true}
    VOLTHIVE_DATA_DIR: /opt/airflow/data
    VOLTHIVE_CONFIG_DIR: /opt/airflow/configs
    VOLTHIVE_PARTNER_MODE: ${VOLTHIVE_PARTNER_MODE:-file}
    VOLTHIVE_GENERATOR_SEED: ${VOLTHIVE_GENERATOR_SEED:-42}
    VOLTHIVE_GENERATOR_PROFILE: ${VOLTHIVE_GENERATOR_PROFILE:-default}
    # TWO entries, and the second one is load-bearing.
    #
    #   /opt/airflow/src   makes `import volthive` work.
    #   /opt/airflow       makes `import dags.common...` work.
    #
    # Every DAG imports its shared helpers as `from dags.common.datasets
    # import ...` - a package rooted at the REPOSITORY, not at the DAGs
    # folder. Airflow puts the DAGs folder itself on sys.path, which resolves
    # `common.datasets` but not `dags.common.datasets`; for that, the parent
    # of dags/ has to be importable too.
    #
    # Without it the scheduler reports, for all four DAGs and for
    # dags/common/default_args.py:
    #
    #   ModuleNotFoundError: No module named 'dags'
    #
    # which the UI shows as "DAG Import Errors (5)" and zero DAGs. The test
    # suite could not catch it, because pytest runs with the repository root
    # already on sys.path - so the tests validated a path shape the container
    # never has. tests/dags/test_container_import_path.py now reproduces the
    # container's sys.path exactly, deriving it from THIS value.
    PYTHONPATH: /opt/airflow/src:/opt/airflow
  volumes:
    # Read-only wherever the container has no business writing.
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./sql:/opt/airflow/sql:ro
    - ./configs:/opt/airflow/configs:ro
    # The operator entry points - apply_schema, generate_data, run_pipeline,
    # restate, dq_report and friends. Mounted so `make run` and the rest of the
    # warehouse lifecycle can execute INSIDE this image, which is the only
    # place the project's Python dependencies are installed. Read-only: these
    # are inputs to the container, never something it should rewrite.
    - ./scripts:/opt/airflow/scripts:ro
    # Writable: the landing zone the generator produces and ingestion reads.
    - ./data:/opt/airflow/data
    # Named volume: logs must survive a restart but must not pollute the repo.
    - airflow-logs:/opt/airflow/logs
  networks:
    - volthive_net

services:
  # ===========================================================================
  # PostgreSQL - three logical databases in one instance
  #
  #   warehouse : the platform (raw, stg, core, mart, dq, audit, ctl - Phase 3)
  #   cms       : the simulated source OLTP system
  #   airflow   : Airflow metadata, isolated from both of the above
  #
  # This is the only stateful service. Its volume is the thing worth protecting.
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: volthive-postgres
    restart: unless-stopped
    environment:
      # Superuser. Used ONLY by the init scripts and for manual administration -
      # no application component ever connects with it.
      POSTGRES_USER: ${POSTGRES_USER:-volthive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Reject unauthenticated host connections explicitly rather than relying
      # on the image default.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by the init scripts in docker/postgres/init/.
      WH_DB: ${WH_DB:-warehouse}
      CMS_DB: ${CMS_DB:-cms}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
      WH_ETL_USER: ${WH_ETL_USER:-wh_etl}
      WH_ETL_PASSWORD: ${WH_ETL_PASSWORD:?set WH_ETL_PASSWORD in .env}
      CMS_OWNER_USER: ${CMS_OWNER_USER:-cms_owner}
      CMS_OWNER_PASSWORD: ${CMS_OWNER_PASSWORD:?set CMS_OWNER_PASSWORD in .env}
      CMS_READER_USER: ${CMS_READER_USER:-cms_reader}
      CMS_READER_PASSWORD: ${CMS_READER_PASSWORD:?set CMS_READER_PASSWORD in .env}
      WH_ANALYST_USER: ${WH_ANALYST_USER:-wh_analyst}
      WH_ANALYST_PASSWORD: ${WH_ANALYST_PASSWORD:?set WH_ANALYST_PASSWORD in .env}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    ports:
      # Host port is separate from the in-network port on purpose: changing how
      # you reach Postgres from Windows must not change how containers reach it.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executed once, in filename order, on the first boot of an empty volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Deliberately stricter than `pg_isready`.
      #
      # During initdb the entrypoint runs the server with listen_addresses=''
      # so it is reachable only over the local socket. Checking over TCP with
      # -h 127.0.0.1 therefore fails until initialisation has fully completed
      # and the real server has started - which is exactly the distinction we
      # need between "container started" and "service ready".
      #
      # The second half asserts all three databases exist, so a partially
      # applied bootstrap can never be reported as healthy.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres -tAc
          "SELECT count(*) = 3 FROM pg_database WHERE datname IN ('$${WH_DB}','$${CMS_DB}','$${AIRFLOW_DB}')"
          | grep -q '^t$$'
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous: first boot has to run initdb plus both init scripts. Failures
      # inside start_period do not count against `retries`.
      start_period: 30s
    networks:
      - volthive_net

  # ===========================================================================
  # airflow-init - one-shot bootstrap, must exit 0 before anything else starts
  #
  # Migrates the metadata database, creates the admin user, ensures the pool.
  # Exists as its own service so the scheduler and webserver cannot race each
  # other running migrations, and so a migration failure is visible as a failed
  # container rather than as two services crash-looping.
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: volthive-airflow-init
    # THE SINGLE BUILD OWNER. See the note on x-airflow-common for why exactly
    # one service may declare this. airflow-init is the right owner because it
    # already runs first and to completion: both long-running services declare
    # `airflow-init: {condition: service_completed_successfully}`, so the image
    # cannot be missing when they start. `pull_policy` is deliberately dropped
    # here - a service that builds its own image must not be told never to
    # obtain one.
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    pull_policy: build
    # A failed bootstrap must stay failed and visible, not restart in a loop.
    restart: "no"
    depends_on:
      postgres:
        # Not `service_started`: Postgres accepting a TCP connection is what we
        # need, and only the healthcheck knows that. No sleep anywhere.
        condition: service_healthy
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.invalid}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Local}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
    # THE BOOTSTRAP RUNS AS A COMMAND, NOT AS AN ENTRYPOINT.
    #
    # This service used to say `entrypoint: /opt/airflow/init.sh`, which
    # REPLACED the image's own /entrypoint. That looks harmless and is not:
    # the image's entrypoint is what makes `user: "<arbitrary-uid>:0"` legal
    # in the first place. Before dispatching a command it runs
    #
    #   check_uid_gid                 - refuse an unusable uid/gid pair
    #   umask 0002                    - keep new dirs group-writable, so the
    #                                   other Airflow containers can write the
    #                                   log volume this one seeds
    #   create_system_user_if_missing - append a /etc/passwd entry for the
    #                                   running UID and export HOME
    #   wait_for_airflow_db           - the image's own metadata-db readiness
    #                                   check (CONNECTION_CHECK_MAX_COUNT)
    #
    # Only the third of those matters for correctness here, and it is decisive.
    # AIRFLOW_UID comes from .env and is whatever `id -u` returned on the
    # machine that ran scripts/generate_env.sh - 1007, 1000, 501, anything.
    # That UID does not exist in the image's /etc/passwd, so with the image
    # entrypoint bypassed, `getpass.getuser()` raises KeyError, and Airflow
    # turns that into a hard failure in airflow/utils/platform.py::getuser():
    #
    #   airflow.exceptions.AirflowConfigException: The user that Airflow is
    #   running as has no username; you must run Airflow as a full user, with
    #   a username and home directory, in order for it to function properly.
    #
    # getuser() is called by _build_metrics() in airflow/utils/cli.py, which
    # the @action_cli decorator runs BEFORE the subcommand body - so `airflow
    # db migrate` failed before it opened a single connection, and the service
    # exited 1 with Postgres perfectly healthy.
    #
    # The scheduler and webserver were never affected: they only set `command`,
    # so they kept the image entrypoint and got their passwd entry. That
    # asymmetry is exactly the bug - one service quietly opted out of a
    # contract the other two depend on.
    #
    # `bash` as the first argument is the image's documented escape hatch:
    # exec_to_bash_or_python_command_if_specified() shifts it off and runs
    # `exec /bin/bash "$@"`, after all four steps above have happened. So the
    # bootstrap still runs as an unprivileged user, still runs to completion,
    # still gates the other two services - it just no longer discards the
    # image's setup to get there.
    #
    # init.sh is baked into the image and made executable there, so a Windows
    # checkout without the executable bit cannot break it.
    command: ["bash", "/opt/airflow/init.sh"]

  # ===========================================================================
  # airflow-scheduler - parses DAGs, schedules and (under LocalExecutor) runs
  # tasks in subprocesses of this container. There is no separate worker.
  # ===========================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: volthive-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        # Wait for the bootstrap to finish AND succeed. If migrations fail, the
        # scheduler never starts, instead of starting against a stale schema.
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: scheduler
    healthcheck:
      # Asks Airflow itself whether a SchedulerJob on THIS host has a recent
      # heartbeat. A process-liveness check would report a wedged scheduler as
      # healthy; a heartbeat check does not.
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    # Let in-flight tasks finish rather than killing them at 10 seconds.
    stop_grace_period: 60s

  # ===========================================================================
  # airflow-webserver - the UI. Read-only in Phase 2: there are no DAGs yet.
  # ===========================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: volthive-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_HOST_PORT:-8080}:8080"
    healthcheck:
      # Airflow's own /health endpoint reports the metadata database and
      # scheduler heartbeat, so this checks the application, not just the port.
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

# ===========================================================================
# Volumes
#   pgdata       : the warehouse. Survives `make down`; destroyed by `make clean`.
#   airflow-logs : task logs. A named volume rather than a bind mount so it
#                  survives restarts without polluting the repository.
# ===========================================================================
volumes:
  pgdata:
    name: volthive_pgdata
  airflow-logs:
    name: volthive_airflow_logs

# ===========================================================================
# Network
#   A single user-defined bridge. Services address each other by service name
#   ("postgres"), which is why POSTGRES_HOST defaults to `postgres` rather than
#   localhost. Only 5432 and 8080 are published to the host.
# ===========================================================================
networks:
  volthive_net:
    name: volthive_net
    driver: bridge
