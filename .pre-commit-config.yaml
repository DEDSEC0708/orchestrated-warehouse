# ---------------------------------------------------------------------------
# pre-commit - runs the same checks locally that CI runs remotely, so CI never
# tells you something you could have found in one second on your own machine.
#
#   make hooks     (once, installs the git hook)
#   pre-commit run --all-files
#
# Hook versions are deliberately aligned with the versions pinned by
# constraints.txt (ruff 0.5.5, sqlfluff 3.4.2) so local hooks and CI cannot
# disagree about what "clean" means.
# ---------------------------------------------------------------------------
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      # Refuse to commit a large file: generated data belongs in data/,
      # which is git-ignored, not in git history.
      - id: check-added-large-files
        args: [--maxkb=512]
      # Secret hygiene, first line of defence. gitleaks runs in CI (Phase 14).
      - id: detect-private-key
      # Enforce LF at commit time, matching .gitattributes.
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        # No .sql files exist until Phase 3; the hook simply matches nothing
        # until then, then starts guarding every SQL file automatically.
        files: \.sql$
