[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volthive-warehouse"
version = "0.1.0"
description = "Orchestrated Warehouse - a local, production-style batch data platform for EV charging analytics (VoltHive Energy, fictional)"
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Orchestrated Warehouse project" }]
keywords = ["data-engineering", "airflow", "postgresql", "data-warehouse", "etl", "elt"]
# Runtime dependencies are declared in requirements.txt so that they can be
# installed together with the official Airflow constraints file. Duplicating
# them here would create a second source of truth.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["volthive*"]
# NOTE: src/volthive is created in Phase 1. Until then this finds zero packages,
# which is valid - `pip install -e .` installs project metadata only.

# ---------------------------------------------------------------------------
# ruff - linter + formatter (single tool, replaces flake8/isort/black)
# Version is pinned by constraints.txt (0.5.5). See ADR-013.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "dags"]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort - import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear - real bug patterns
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "DTZ",  # flake8-datetimez - naive datetimes are a bug in a UTC-first warehouse
    "T20",  # flake8-print - no stray print() in pipeline code; use structlog
    "S",    # flake8-bandit - includes hardcoded-password detection (S105/S106)
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    # SIM117 wants `with connect() as conn, transaction(conn):` collapsed onto
    # one line. It is legal Python and it is worse here. A connection and a
    # transaction are two different lifetimes - the connection outlives the
    # transaction, and a later change that adds a second transaction on the
    # same connection has to un-collapse it again. This project treats
    # transaction boundaries as load-bearing and indents them so they are
    # visible at a glance; hiding one behind a comma works against that.
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, hardcode obviously-fake credentials, and print.
# Beyond the obvious (assert, fake credentials, print):
#   S608   the SQL built in tests comes from module-level constant table lists
#          used to assert the same property across every table, never input.
#   RUF007 itertools.pairwise is neater, but zip(xs, xs[1:]) reads more
#          plainly in an assertion about SUCCESSIVE READINGS, which is what
#          these tests are about.
#   N818   _Rollback is a control-flow SENTINEL used to abort a mutating
#          assertion block and roll it back. It is not an error, and calling
#          it _RollbackError would say the opposite of what it means.
#   N802   one test name shouts a word (test_check_results_DO_accumulate) to
#          mark it as the deliberate exception to the surrounding class of
#          "nothing changes" assertions. The emphasis is the point.
"tests/**/*.py" = [
    "S101", "S105", "S106", "T20", "ARG001", "ARG002",
    "S608", "RUF007", "N818", "N802",
]
# Airflow DAG files legitimately execute code at import time.
"dags/**/*.py" = ["E402"]
# Operator-facing CLIs. Every one of these is deliberate, and each is listed
# with the reason rather than switched off globally:
#
#   T201  print IS the interface of a command-line tool. structlog goes to
#         stdout as JSON for machines; these lines are for the human running
#         the script, and routing them through a logger would make --json
#         output unparseable.
#   E402  sys.path is extended to reach src/ before the imports, so that a
#         fresh clone runs without an editable install.
#   S608  the SQL these scripts build is assembled from module-level constant
#         table names (RAW_HISTORY_TABLES and friends), never from user input.
#         The rule cannot see that; a reviewer can.
"scripts/**/*.py" = ["T201", "E402", "S608"]
# The data generator's whole purpose is pseudo-random synthetic data, seeded
# for reproducibility. S311 warns that `random` is not cryptographic, which is
# exactly what is wanted here: a CSPRNG could not be seeded to reproduce a
# dataset, and reproducibility is the property the entire test suite rests on.
"src/volthive/generator/**/*.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["volthive"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"   # containers are Linux; never emit CRLF from the formatter

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
# Import the package from src/ without requiring an editable install, so a
# fresh clone can run `pytest` immediately and CI cannot pass or fail because
# of install state rather than code.
pythonpath = ["src"]
markers = [
    "unit: fast, no external dependencies, everything I/O is mocked",
    "dags: Airflow DAG integrity checks - imports only, no database",
    "integration: requires a real PostgreSQL instance",
    "e2e: full pipeline run, including the idempotency proof",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py", "*/mock_partner_api/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# mypy - wired into `make typecheck` from Phase 1, when src/volthive exists
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false   # tightened to true once the package stabilises
